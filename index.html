<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Участок и дом — 3D-схема v1</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#F5F2EA;overflow:hidden;
  font-family:system-ui,'Segoe UI',Arial,sans-serif;}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
#panel{position:absolute;top:10px;left:10px;background:rgba(245,242,234,.92);

#panel h1{font-size:15px;margin:0 0 6px;color:#4A453A;font-weight:600;}
#panel .btns{display:flex;gap:6px;flex-wrap:wrap;}
#panel button{font-size:12px;padding:4px 10px;border:1px solid #B0A892;border-radius:6px;
  background:#EFEAE0;color:#4A453A;cursor:pointer;}

#panel button.off{opacity:.6;}
#hint{font-size:11px;color:#8A8578;margin-top:5px;}
#rotPanel{position:absolute;top:118px;left:10px;background:rgba(245,242,234,.92);
  border:1px solid #C9C2B2;border-radius:8px;padding:7px 10px;
  box-shadow:0 2px 8px rgba(90,80,60,.15);z-index:10;display:none;font-size:12px;color:#4A453A;}
#rotPanel .btns{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0;}
#rotPanel button{font-size:12px;padding:3px 8px;border:1px solid #B0A892;border-radius:6px;
  background:#EFEAE0;color:#4A453A;cursor:pointer;}

#rotVal{font-weight:600;}
#infoPanel{position:absolute;bottom:14px;left:10px;background:rgba(245,242,234,.82);
  border:1px solid #C9C2B2;border-radius:8px;padding:8px 12px;z-index:10;display:none;
  font-size:12px;color:#4A453A;line-height:1.55;box-shadow:0 2px 8px rgba(90,80,60,.15);}
#warn{position:absolute;top:12px;right:12px;background:rgba(176,48,48,.92);color:#FFF;
  border-radius:8px;padding:8px 14px;z-index:11;display:none;font-size:13px;font-weight:600;
  box-shadow:0 2px 8px rgba(90,30,30,.3);}
</style>

<body>
<canvas id="scene"></canvas>
<div id="panel">
  <h1>Участок и дом — 3D-схема v1</h1>
  <div class="btns">
    <button id="btnRoof">Крыша: вкл</button>
    <button id="btnTop">Вид сверху</button>
    <button id="btnLabels">Подписи: вкл</button>
    <button id="btnReset">Сброс камеры</button>
    <button id="btnMove" class="off">Двигать: выкл</button>
  </div>
  <div id="hint">ЛКМ — орбита · колесо — зум · ПКМ / Shift+ЛКМ — панорама · «Двигать»: клик — выбрать, drag — переместить</div>
</div>
<div id="rotPanel">
  <span id="rotObj">Объект</span>: <span id="rotVal">поворот: +0°</span>
  <div class="btns">
    <button data-d="-5">⟲ −5°</button>
    <button data-d="-1">−1°</button>
    <button data-d="1">+1°</button>
    <button data-d="5">+5° ⟳</button>
    <button id="btnResetPos">Сбросить позицию</button>
  </div>
</div>
<div id="infoPanel"></div>
<div id="warn"></div>
<script>
'use strict';
/* ================================================================
   Участок и дом — интерактивная 3D-схема.
   Собственный движок на canvas: перспективная проекция,
   painter's algorithm, плоское затенение полигонов по нормали.
   Система координат: X — восток, Y — север, Z — вверх (метры).
   ================================================================ */

/* ---- Константы из ТЗ ---- */
// Участок (вершины по контуру, против часовой от северного угла)
const V=[[-1.10,24.30],[-17.76,-3.13],[-1.98,-16.92],[1.80,-16.33],[19.04,12.08]];
// V0 — северный угол; V2/V3 — южный угол = перекрёсток дорог
const u=[Math.sin(31*Math.PI/180), Math.cos(31*Math.PI/180)];   // длинная ось
const v=[Math.sin(121*Math.PI/180), Math.cos(121*Math.PI/180)]; // поперечная ось
const C_h=[-1.25,3.25];  // центр дома (план 17.2×10.3)
const C_g=[9.5,11.5];    // центр гаража 8.5×6.0
function H(px,py){ return [C_h[0]+(px-8.6)*u[0]-(py-5.15)*v[0], C_h[1]+(px-8.6)*u[1]-(py-5.15)*v[1]]; }
function G(gx,gy){ return [C_g[0]+(gx-4.25)*u[0]+(gy-3.0)*v[0], C_g[1]+(gx-4.25)*u[1]+(gy-3.0)*v[1]]; }
function hw(px,py,z){ const p=H(px,py); return [p[0],p[1],z]; }
function gw(gx,gy,z){ const p=G(gx,gy); return [p[0],p[1],z]; }

/* ---- Палитра (север/Карелия, приглушённая) ---- */
const COL={lawn:'#A8BE90',asphalt:'#8E8E88',gravel:'#C8C2B4',gravel2:'#D4CEC0',
  wall:'#EFE6D5',gwall:'#E3DCD0',roof:'#4A4A4A',glass:'#9DB8D2',door:'#8A6D4A',
  floor:'#E5DCC8',gfloor:'#CFC8BA',deck:'#B09A72',porch:'#C4BCAB',part:'#D8CDB8',
  fence:'#7A6A55',gate:'#8A4A3A',slate:'#6A6A66',soil:'#9A8A6A',spruce:'#3E5A3E',
  birch:'#7A9A4A',trunk:'#6A4A3A',btrunk:'#DDDDDD',bush1:'#B5CFA0',bush2:'#C9A227',
  ggates:'#7A7A7A',shelf:'#999999',su:'#D8D8D8',car1:'#9DB8D2',car2:'#B8B0A0',
  step:'#B4AA96',post:'#6A5A45',
  furnWood:'#A98F6A',furnWood2:'#8A7355',furnFab:'#8FA3B8',furnFab2:'#B0A48E',
  furnWhite:'#F0EDE6',furnDark:'#55534E',furnTV:'#3A3A3A'};

/* ---- Состояние камеры и режимов ---- */
const DEF={az:135*Math.PI/180, el:32*Math.PI/180, dist:55, target:[0,0,0]};
const cam={az:DEF.az, el:DEF.el, dist:DEF.dist, target:DEF.target.slice()};
let roofOn=true, labelsOn=true, dirty=true;
let viewW=1280, viewH=800;
// Подбор дистанции и центрирование: участок занимает ~62% ширины viewport
// (и не более 72% высоты) — запас на деревья, крыши и дороги по краям
function fitDist(){
  cam.dist=DEF.dist;
  for(let it=0; it<8; it++){
    computePV();
    let x0=1e9, x1=-1e9, y0=1e9, y1=-1e9;
    // bbox по углам участка на земле И на высоте деревьев/крыш (z=7),
    // чтобы верх сцены не обрезался в перспективе
    for(let i=0;i<V.length;i++){
      for(const zz of [0,7]){
        const s=projectPoint(V[i][0],V[i][1],zz);
        if(s[0]<x0) x0=s[0]; if(s[0]>x1) x1=s[0];
        if(s[1]<y0) y0=s[1]; if(s[1]>y1) y1=s[1];
      }
    }
    const wpp=cam.dist/PV.focal; // мировых метров на пиксель у target
    cam.target[0]+=PV.r[0]*((x0+x1)/2-viewW/2)*wpp + PV.up[0]*((viewH/2-(y0+y1)/2))*wpp;
    cam.target[1]+=PV.r[1]*((x0+x1)/2-viewW/2)*wpp + PV.up[1]*((viewH/2-(y0+y1)/2))*wpp;
    cam.target[2]+=PV.r[2]*((x0+x1)/2-viewW/2)*wpp + PV.up[2]*((viewH/2-(y0+y1)/2))*wpp;
    if(cam.target[2]<0) cam.target[2]=0;
    const k=Math.max((x1-x0)/(0.55*viewW), (y1-y0)/(0.62*viewH));
    if(Math.abs(k-1)<0.02 && Math.abs((x0+x1)/2-viewW/2)<3 && Math.abs((y0+y1)/2-viewH/2)<3) break;
    cam.dist*=k;
  }
}
function resetCam(){ cam.az=DEF.az; cam.el=DEF.el; cam.target=DEF.target.slice(); fitDist(); dirty=true; }

/* ---- Камера: перспективная проекция, камера на сфере вокруг target ---- */
let PV={eye:[0,0,0], r:[1,0,0], up:[0,1,0], f:[0,0,1], focal:1000};
function computePV(){
  const ce=Math.cos(cam.el), se=Math.sin(cam.el);
  const eye=[cam.target[0]+cam.dist*ce*Math.sin(cam.az),
             cam.target[1]+cam.dist*ce*Math.cos(cam.az),
             cam.target[2]+cam.dist*se];
  let f=[cam.target[0]-eye[0], cam.target[1]-eye[1], cam.target[2]-eye[2]];
  const fl=Math.hypot(f[0],f[1],f[2])||1e-9; f=[f[0]/fl,f[1]/fl,f[2]/fl];
  let r=[f[1],-f[0],0];
  const rl=Math.hypot(r[0],r[1])||1e-9; r=[r[0]/rl,r[1]/rl,0];
  const up=[r[1]*f[2]-r[2]*f[1], r[2]*f[0]-r[0]*f[2], r[0]*f[1]-r[1]*f[0]];
  const focal=(Math.min(viewW,viewH)/2)/Math.tan(22.5*Math.PI/180); // fov 45°
  PV={eye:eye, r:r, up:up, f:f, focal:focal};
}
function projectPoint(x,y,z){
  const dx=x-PV.eye[0], dy=y-PV.eye[1], dz=z-PV.eye[2];
  const cx=dx*PV.r[0]+dy*PV.r[1]+dz*PV.r[2];
  const cy=dx*PV.up[0]+dy*PV.up[1]+dz*PV.up[2];
  const cz=dx*PV.f[0]+dy*PV.f[1]+dz*PV.f[2];
  return [viewW/2+cx*PV.focal/cz, viewH/2-cy*PV.focal/cz, cz];
}

/* ---- Затенение: свет с юго-запада сверху ---- */
const LIGHT=(function(){ const L=Math.hypot(0.55,0.5,0.67); return [-0.55/L,-0.5/L,0.67/L]; })();
function polyNormal(pts){
  let nx=0,ny=0,nz=0;
  for(let i=0;i<pts.length;i++){
    const a=pts[i], b=pts[(i+1)%pts.length];
    nx+=(a[1]-b[1])*(a[2]+b[2]);
    ny+=(a[2]-b[2])*(a[0]-b[0]);
    nz+=(a[0]-b[0])*(a[1]-b[1]);
  }
  const L=Math.hypot(nx,ny,nz)||1e-9;
  return [nx/L,ny/L,nz/L];
}
function shade(hex,k){
  const r=parseInt(hex.substr(1,2),16), g=parseInt(hex.substr(3,2),16), b=parseInt(hex.substr(5,2),16);
  return 'rgb('+Math.min(255,Math.round(r*k))+','+Math.min(255,Math.round(g*k))+','+Math.min(255,Math.round(b*k))+')';
}

/* ---- Контейнеры сцены ---- */
const polys=[];   // {pts:[[x,y,z]...], color, layer, roof, interior, zv}
const lines=[];   // {pts:[[x,y,z]...], color, dash}
const labels=[];  // {p:[x,y,z], t:[строки], room}

let curObj=null; // имя пересобираемого объекта ('house'/'garage') во время построения
function poly(pts,color,opts){
  opts=opts||{};
  let zv=0; for(let i=0;i<pts.length;i++) zv+=pts[i][2]; zv/=pts.length;
  polys.push({pts:pts, color:color, layer:(opts.layer===undefined?1:opts.layer), roof:!!opts.roof, interior:!!opts.interior, zv:zv, obj:curObj});
}
function pushLine(ln){ ln.obj=curObj; lines.push(ln); }
function pushLabel(lb){ lb.obj=curObj; labels.push(lb); }
function quad(a,b,c,d,color,opts){ poly([a,b,c,d],color,opts); }
function flat(pts2,z,color){ // плоский полигон по 2D-точкам
  poly(pts2.map(function(p){ return [p[0],p[1],z]; }), color, {layer:0});
}
function flatT(T,pts2,z,color){
  poly(pts2.map(function(p){ const q=T(p[0],p[1]); return [q[0],q[1],z]; }), color, {layer:0});
}
// Параллелепипед по 4 углам основания через аффинное преобразование T(x,y)->[x,y]
function rectBox(T,x1,y1,x2,y2,z0,h,color,opts){
  const c=[T(x1,y1),T(x2,y1),T(x2,y2),T(x1,y2)];
  const B=c.map(function(p){ return [p[0],p[1],z0]; });
  const Tp=c.map(function(p){ return [p[0],p[1],z0+h]; });
  quad(Tp[0],Tp[1],Tp[2],Tp[3],color,opts);
  for(let i=0;i<4;i++){ const j=(i+1)%4; quad(B[i],B[j],Tp[j],Tp[i],color,opts); }
}
// Параллелепипед по центру, размерам и углу поворота
function rbox(cx,cy,z0,w,d,h,ang,color,opts){
  const c=Math.cos(ang), s=Math.sin(ang);
  const P=function(lx,ly,lz){ return [cx+lx*c-ly*s, cy+lx*s+ly*c, lz]; };
  const a=w/2, b=d/2;
  const b1=P(-a,-b,z0),b2=P(a,-b,z0),b3=P(a,b,z0),b4=P(-a,b,z0);
  const t1=P(-a,-b,z0+h),t2=P(a,-b,z0+h),t3=P(a,b,z0+h),t4=P(-a,b,z0+h);
  quad(t1,t2,t3,t4,color,opts);
  quad(b1,b2,t2,t1,color,opts); quad(b2,b3,t3,t2,color,opts);
  quad(b3,b4,t4,t3,color,opts); quad(b4,b1,t1,t4,color,opts);
}
// Стена вдоль отрезка (тонкий параллелепипед)
function wallSeg(x1,y1,x2,y2,z0,h,t,color,opts){
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1e-9;
  const nx=-dy/L*t/2, ny=dx/L*t/2;
  const a=[x1+nx,y1+ny], b=[x2+nx,y2+ny], c=[x2-nx,y2-ny], d=[x1-nx,y1-ny];
  const z1=z0+h;
  quad([a[0],a[1],z1],[b[0],b[1],z1],[c[0],c[1],z1],[d[0],d[1],z1],color,opts);
  quad([a[0],a[1],z0],[b[0],b[1],z0],[b[0],b[1],z1],[a[0],a[1],z1],color,opts);
  quad([c[0],c[1],z0],[d[0],d[1],z0],[d[0],d[1],z1],[c[0],c[1],z1],color,opts);
  quad([b[0],b[1],z0],[c[0],c[1],z0],[c[0],c[1],z1],[b[0],b[1],z1],color,opts);
  quad([d[0],d[1],z0],[a[0],a[1],z0],[a[0],a[1],z1],[d[0],d[1],z1],color,opts);
}
// Плоская полоса (дорожка) по отрезку
function strip(x1,y1,x2,y2,w,z,color){
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1e-9;
  const nx=-dy/L*w/2, ny=dx/L*w/2;
  flat([[x1+nx,y1+ny],[x2+nx,y2+ny],[x2-nx,y2-ny],[x1-nx,y1-ny]],z,color);
}
// Двускатная крыша: T(lx,ly,lz)->world, конёк вдоль оси lx
function gable(T,cx,cy,L,W,zWall,rise,ov,color){
  const hl=L/2+ov, hw2=W/2+ov, zr=zWall+rise;
  const P=function(a,b,z){ return T(cx+a,cy+b,z); };
  const r1=P(-hl,0,zr), r2=P(hl,0,zr);
  const e1=P(-hl,-hw2,zWall), e2=P(hl,-hw2,zWall), e3=P(hl,hw2,zWall), e4=P(-hl,hw2,zWall);
  quad(e1,e2,r2,r1,color,{roof:true});
  quad(r1,r2,e3,e4,color,{roof:true});
  poly([e2,e3,r2],color,{roof:true});
  poly([e4,e1,r1],color,{roof:true});
}
function cone8(cx,cy,z0,r,h,color){
  const apex=[cx,cy,z0+h], ring=[];
  for(let i=0;i<8;i++){ const a=i/8*2*Math.PI; ring.push([cx+r*Math.cos(a),cy+r*Math.sin(a),z0]); }
  for(let i=0;i<8;i++) poly([ring[i],ring[(i+1)%8],apex],color);
  poly(ring.slice().reverse(),color);
}
function cyl8(cx,cy,z0,r,h,color){
  const rb=[], rt=[];
  for(let i=0;i<8;i++){ const a=i/8*2*Math.PI;
    rb.push([cx+r*Math.cos(a),cy+r*Math.sin(a),z0]);
    rt.push([cx+r*Math.cos(a),cy+r*Math.sin(a),z0+h]); }
  poly(rt,color);
  for(let i=0;i<8;i++){ const j=(i+1)%8; quad(rb[i],rb[j],rt[j],rt[i],color); }
}
// «Шар»-октаэдр для крон/кустов
function blob(cx,cy,cz,rx,ry,rz,color){
  const t=[cx,cy,cz+rz], b=[cx,cy,cz-rz];
  const e=[[cx+rx,cy,cz],[cx,cy+ry,cz],[cx-rx,cy,cz],[cx,cy-ry,cz]];
  for(let i=0;i<4;i++){ const j=(i+1)%4;
    poly([e[i],e[j],t],color); poly([e[j],e[i],b],color); }
}

/* ================================================================
   ПОСТРОЕНИЕ СЦЕНЫ
   ================================================================ */

/* ---- Участок ---- */
flat(V,0,COL.lawn);

/* ---- Дороги снаружи: полоса 7 м, целиком СНАРУЖИ контура, у южного угла-перекрёстка ----
   Вдоль ребра V2→V1 (западная) и V3→V4 (восточная); начало — 14 м до угла V2/V3,
   конец — 10 м за V1 / V4. Внутренняя кромка полосы совпадает с линией ребра. */
function roadGeom(P,Q){
  const dx=Q[0]-P[0], dy=Q[1]-P[1], L=Math.hypot(dx,dy)||1e-9;
  let nx=-dy/L, ny=dx/L;
  const mx=(P[0]+Q[0])/2, my=(P[1]+Q[1])/2; // центроид участка ≈ (0,0)
  if(nx*mx+ny*my<0){ nx=-nx; ny=-ny; }       // нормаль наружу
  return {ux:dx/L, uy:dy/L, nx:nx, ny:ny};
}
const gW=roadGeom(V[2],V[1]), gE=roadGeom(V[3],V[4]);
(function(){
  function strip(g,P,Q,back,fwd,w){
    const s=[P[0]-g.ux*back, P[1]-g.uy*back], e=[Q[0]+g.ux*fwd, Q[1]+g.uy*fwd];
    flat([[s[0],s[1]],[e[0],e[1]],[e[0]+g.nx*w,e[1]+g.ny*w],[s[0]+g.nx*w,s[1]+g.ny*w]],0.01,COL.asphalt);
  }
  strip(gW,V[2],V[1],9,6,7); // западная дорога
  strip(gE,V[3],V[4],9,6,7); // восточная дорога
  // апрон перекрёстка: клин между внутренними кромками дорог у южного угла
  const A=V[2], B=V[3];
  const det=gW.ux*(-gE.uy)-gW.uy*(-gE.ux);
  if(Math.abs(det)>1e-6){
    const dx=B[0]-A[0], dy=B[1]-A[1];
    const t=(dx*(-gE.uy)-dy*(-gE.ux))/det;
    if(t<0) flat([[A[0],A[1]],[B[0],B[1]],[A[0]+gW.ux*t,A[1]+gW.uy*t]],0.01,COL.asphalt);
  }
})();

/* ---- Подъезд, парковка, ворота (по формулам ТЗ) ---- */
const dB=(function(){ const dx=V[4][0]-V[3][0], dy=V[4][1]-V[3][1], L=Math.hypot(dx,dy);
  return [dx/L,dy/L]; })();
const gate_pt=[V[3][0]+dB[0]*3.0, V[3][1]+dB[1]*3.0];
const dv=[-v[0]*4.3, -v[1]*4.3];
// подъезд (щебень гранитный)
const DRIVE=[[gate_pt[0]-dB[0]*1.0,        gate_pt[1]-dB[1]*1.0],
      [V[3][0]+dB[0]*26.5,          V[3][1]+dB[1]*26.5],
      [V[3][0]+dB[0]*26.5+dv[0],    V[3][1]+dB[1]*26.5+dv[1]],
      [gate_pt[0]-dB[0]*1.0+dv[0],  gate_pt[1]-dB[1]*1.0+dv[1]]];
flat(DRIVE, 0.02, COL.gravel);
// парковочный карман 13.0×2.5
const PK=[[5.0,0.3],[18.0,0.3],[18.0,2.8],[5.0,2.8]].map(function(s){
  return [V[3][0]+dB[0]*s[0]-v[0]*s[1], V[3][1]+dB[1]*s[0]-v[1]*s[1]];
});
flat(PK,0.03,COL.gravel2);
// разделитель мест (пунктир)
lines.push({pts:[[V[3][0]+dB[0]*11.5-v[0]*0.4, V[3][1]+dB[1]*11.5-v[1]*0.4, 0.06],
                 [V[3][0]+dB[0]*11.5-v[0]*2.7, V[3][1]+dB[1]*11.5-v[1]*2.7, 0.06]],
            color:'#8A8578', dash:[7,5]});
// 2 автомобиля 4.7×1.9×1.6, ориентированы вдоль dB
const carAng=Math.atan2(dB[1],dB[0]);
const CARS=[];
for(let i=0;i<2;i++){

/* ---- Забор, ворота 4.5 м + калитка 1.0 м ---- */
for(let i=0;i<5;i++){
  const A=V[i], B=V[(i+1)%5];
  if(i===3){
    const L=Math.hypot(B[0]-A[0],B[1]-A[1]);
    const d=[(B[0]-A[0])/L,(B[1]-A[1])/L];
    const at=function(s){ return [A[0]+d[0]*s, A[1]+d[1]*s]; };
    const g1=at(0.75), g2=at(5.25), w1=at(5.5), w2=at(6.5);
    const f1=at(0.45), f2=at(6.8);
    wallSeg(A[0],A[1],f1[0],f1[1],0,1.1,0.06,COL.fence);
    wallSeg(f2[0],f2[1],B[0],B[1],0,1.1,0.06,COL.fence);
    wallSeg(g1[0],g1[1],g2[0],g2[1],0,1.5,0.05,COL.gate);  // полотно ворот
    wallSeg(w1[0],w1[1],w2[0],w2[1],0,1.4,0.05,COL.gate);  // калитка
    [g1,g2,w1,w2].forEach(function(p){ rbox(p[0],p[1],0,0.24,0.24,1.8,0,COL.post); });
  } else {
    wallSeg(A[0],A[1],B[0],B[1],0,1.1,0.06,COL.fence);
  }
}

// Преобразование плана (px,py) -> координаты участка с центром (cx,cy)
// и добавочным поворотом angDeg вокруг центра объекта. sgn: -1 дом, +1 гараж.
function makeXform(cx,cy,angDeg,mx,my,sgn){
  const th=angDeg*Math.PI/180, cs=Math.cos(th), sn=Math.sin(th);
  return function(px,py){
    const ox=(px-mx)*u[0]+sgn*(py-my)*v[0], oy=(px-mx)*u[1]+sgn*(py-my)*v[1];
    return [cx+ox*cs-oy*sn, cy+ox*sn+oy*cs];
  };
}

function buildGarage(st){
  const GG=makeXform(st.c[0],st.c[1],st.ang,4.25,3.0,1);
  const gwx=function(gx,gy,z){ const p=GG(gx,gy); return [p[0],p[1],z]; };
  curObj='garage';
  flatT(GG,GF,0.1,COL.gfloor);
  for(let i=0;i<4;i++){
    const a=GF[i], b=GF[(i+1)%4];
    const A=GG(a[0],a[1]), B=GG(b[0],b[1]);
    wallSeg(A[0],A[1],B[0],B[1],0.1,3.1,0.3,COL.gwall);
  }
  gable(gwx,4.25,3.0,8.5,6.0,3.2,1.8,0.5,COL.roof);
  function winG(x1,y1,x2,y2,z0,z1,col){
    quad(gwx(x1,y1,z0),gwx(x2,y2,z0),gwx(x2,y2,z1),hwx_dummy=0,quad_args_fix=0,col||COL.glass);
  }
  winG(2.75,-0.17,5.75,-0.17,0.1,2.4,COL.ggates); // секционные ворота 3.0×2.4 (юг)
  winG(-0.17,1.5,-0.17,2.5,0.1,2.1,COL.door);     // пешеходная дверь (запад)
  winG(1.4,6.17,2.6,6.17,1.0,2.2);                // окна северной стены
  winG(5.9,6.17,7.1,6.17,1.0,2.2);
  // наполнение (видно при «крыша выкл»)
  rectBox(GG,2.75,5.3,5.75,6.0,0.1,0.8,COL.door,{interior:true});   // верстак 3.0×0.7×0.9
  rectBox(GG,6.9,4.0,8.5,6.0,0.1,2.3,COL.su,{interior:true});       // СУ-блок 1.6×2.0×2.4
  rectBox(GG,0.0,2.4,0.6,3.6,0.1,1.7,COL.shelf,{interior:true});    // стеллаж западный 1.2 м
  rectBox(GG,7.9,2.0,8.5,4.2,0.1,1.7,COL.shelf,{interior:true});    // стеллаж восточный 2.2 м
  // мото-зона 2.5×3.0 (пунктир на полу)
  const mz=[GG(0.2,1.5),GG(2.7,1.5),GG(2.7,4.5),GG(0.2,4.5)];
  for(let i=0;i<4;i++){
    const a=mz[i], b=mz[(i+1)%4];
    pushLine({pts:[[a[0],a[1],0.14],[b[0],b[1],0.14]], color:'#7A756A', dash:[5,4]});
  }
  rectBox(GG,0.4,2.2,2.2,2.8,0.1,1.0,COL.furnDark,{interior:true}); // мотоцикл-заглушка в мото-зоне
  const gc=GG(4.25,3.0);
  pushLabel({p:[gc[0],gc[1],5.6], t:['Гараж-мастерская','51 м²'], room:false, area:51});
  curObj=null;
}
// Удалить полигоны/линии/подписи объекта и пересобрать его по состоянию
function removeObj(name){
  function filt(arr){ let w=0; for(let i=0;i<arr.length;i++){ if(arr[i].obj!==name) arr[w++]=arr[i]; } arr.length=w; }
  filt(polys); filt(lines); filt(labels);
}
function rebuildObj(name){
  removeObj(name);
  if(name==='house') buildHouse(state.house); else buildGarage(state.garage);
  revalidate();
  dirty=true;
}
buildHouse(state.house);
buildGarage(state.garage);

/* ---- Дорожка крыльцо → калитка (сланец, ширина 1.2, ломаная) ---- */
const PATH=(function(){
  const pStart=H(3.9,-2.0);
  const pEnd=[gate_pt[0]-dB[0]*1.0+dv[0]-u[0]*2.0, gate_pt[1]-dB[1]*1.0+dv[1]-u[1]*2.0];
  const dx=pEnd[0]-pStart[0], dy=pEnd[1]-pStart[1], L=Math.hypot(dx,dy)||1e-9;
  const pMid=[(pStart[0]+pEnd[0])/2 - dy/L*1.5, (pStart[1]+pEnd[1])/2 + dx/L*1.5];
  strip(pStart[0],pStart[1],pMid[0],pMid[1],1.2,0.02,COL.slate);
  strip(pMid[0],pMid[1],pEnd[0],pEnd[1],1.2,0.02,COL.slate);
  return [pStart,pMid,pEnd];
})();

const TREES=[[-1.5,21.8],[2.5,20.5],[5.5,22.0],[12.0,16.5],[16.2,13.6],[17.8,9.0],

/* Точка внутри полигона (ray casting) */
function inPoly2(x,y,pg){
  let ins=false;
  for(let i=0,j=pg.length-1;i<pg.length;j=i++){
    const xi=pg[i][0], yi=pg[i][1], xj=pg[j][0], yj=pg[j][1];
    if(((yi>y)!=(yj>y)) && (x<(xj-xi)*(y-yi)/(yj-yi)+xi)) ins=!ins;
  }
  return ins;
}
function ptSegDist(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy||1e-9;
  let t=((px-ax)*dx+(py-ay)*dy)/(L2*L2); t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+dx*t), py-(ay+dy*t));
}
function polyEdgeDist(x,y,pg){ // мин. расстояние до границы полигона
  let m=1e9;
  for(let i=0,j=pg.length-1;i<pg.length;j=i++)
    m=Math.min(m, ptSegDist(x,y,pg[j][0],pg[j][1],pg[i][0],pg[i][1]));
  return m;
}
/* Корректировка деревьев, попавших за границу участка (ошибка исходных координат,
   на генплане они внутри): point-in-polygon по V; если снаружи — сдвиг по внутренней
   нормали ближайшего ребра на 2 м внутрь от границы. Если место занято (подъезд,
   парковка, дом, гараж, терраса, крыльцо, авто, дорожка, другие деревья) — скользим
   вдоль ребра до ближайшего свободного места; запасной вариант — глубже (6.5 м). */
const HOUSEW=FP.map(function(p){ return H(p[0],p[1]); });
const GARW=GF.map(function(p){ return G(p[0],p[1]); });
const TERRW=[[-2.6,6.0],[0,6.0],[0,10.3],[3.0,10.3],[3.0,12.2],[-2.6,12.2]].map(function(p){ return H(p[0],p[1]); });
const PORCHW=[[2.6,-2.6],[5.15,-2.6],[5.15,0],[2.6,0]].map(function(p){ return H(p[0],p[1]); });
function treeSpotFree(x,y,selfIdx){
  if(!inPoly2(x,y,V) || polyEdgeDist(x,y,V)<1.0) return false;
  const zones=[[DRIVE,0.6],[PK,0.6],[HOUSEW,1.4],[GARW,1.4],[TERRW,1.4],[PORCHW,1.4]];
  for(let i=0;i<zones.length;i++)
    if(inPoly2(x,y,zones[i][0]) || polyEdgeDist(x,y,zones[i][0])<zones[i][1]) return false;
  for(let i=0;i<CARS.length;i++)
    if(Math.hypot(x-CARS[i][0],y-CARS[i][1])<2.7) return false;
  for(let i=0;i<PATH.length-1;i++)
    if(ptSegDist(x,y,PATH[i][0],PATH[i][1],PATH[i+1][0],PATH[i+1][1])<1.3) return false;
  for(let i=0;i<TREES.length;i++)
    if(i!==selfIdx && Math.hypot(x-TREES[i][0],y-TREES[i][1])<2.5) return false;
  return true;
}
TREES.forEach(function(t,k){
  if(inPoly2(t[0],t[1],V)) return;
  let best=null;
  for(let i=0;i<V.length;i++){
    const A=V[i], B=V[(i+1)%V.length];
    const dx=B[0]-A[0], dy=B[1]-A[1], L=Math.hypot(dx,dy)||1e-9;
    let nx=-dy/L, ny=dx/L; // левая нормаль; контур CCW — это внутрь
    const tt=Math.max(0,Math.min(1,((t[0]-A[0])*dx+(t[1]-A[1])*dy)/(L*L)));
    const qx=A[0]+dx*tt, qy=A[1]+dy*tt; // ближайшая точка ребра
    const d=Math.hypot(t[0]-qx,t[1]-qy);
    if(!best || d<best.d) best={d:d, ux:dx/L, uy:dy/L, nx:nx, ny:ny, qx:qx, qy:qy};
  }
  if(best.nx*(-best.qx)+best.ny*(-best.qy)<0){ best.nx=-best.nx; best.ny=-best.ny; } // строго внутрь
  const dts=[0]; for(let m=1;m<=14;m++){ dts.push(-1.5*m, 1.5*m); }
  let done=false;
  for(let di=0; di<dts.length && !done; di++){
    for(let pi=0; pi<2 && !done; pi++){
      const perp=(pi===0)?2.0:6.5;
      const nx2=best.qx+best.ux*dts[di]+best.nx*perp;
      const ny2=best.qy+best.uy*dts[di]+best.ny*perp;
      if(treeSpotFree(nx2,ny2,k)){ TREES[k]=[nx2,ny2]; done=true; }
    }
  }
  if(!done) TREES[k]=[best.qx+best.nx*6.5, best.qy+best.ny*6.5]; // fallback
});
TREES.forEach(function(t,i){

let moveMode=false;   // режим «Двигать»

let grab=null;        // {obj, off:[dx,dy]} — захваченный объект и grab-offset
// Кольца footprint'а объекта в координатах участка (для дома: контур+выступ И терраса)
function objRings(name){
  const st=state[name];
  if(name==='house'){
    const T=makeXform(st.c[0],st.c[1],st.ang,8.6,5.15,-1);
    return [FP.map(function(p){ return T(p[0],p[1]); }),
            TERRP.map(function(p){ return T(p[0],p[1]); })];
  }
  const T=makeXform(st.c[0],st.c[1],st.ang,4.25,3.0,1);
  return [GF.map(function(p){ return T(p[0],p[1]); })];
}
// Строгое пересечение отрезков (без касаний концами)
function segsCross(ax,ay,bx,by,cx,cy,dx,dy){
  const d1=(cx-ax)*(by-ay)-(cy-ay)*(bx-ax);
  const d2=(dx-ax)*(by-ay)-(dy-ay)*(bx-ax);
  const d3=(ax-cx)*(dy-cy)-(ay-cy)*(dx-cx);
  const d4=(bx-cx)*(dy-cy)-(by-cy)*(dx-cx);
  return ((d1>0&&d2<0)||(d1<0&&d2>0)) && ((d3>0&&d4<0)||(d3<0&&d4>0));
}
function bboxOf(pts){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(let i=0;i<pts.length;i++){
    if(pts[i][0]<x0)x0=pts[i][0]; if(pts[i][0]>x1)x1=pts[i][0];
    if(pts[i][1]<y0)y0=pts[i][1]; if(pts[i][1]>y1)y1=pts[i][1];
  }
  return {x0:x0,x1:x1,y0:y0,y1:y1};
}
function bboxOverlap(a,b){ return a.x0<b.x1 && a.x1>b.x0 && a.y0<b.y1 && a.y1>b.y0; }
// Пересечение наборов колец с допуском по глубине проникновения (TOL м):
// эталонная раскладка дом/гараж по константам ТЗ имеет касание-клин ~0.24 м,
// поэтому мелкие касания не считаются конфликтом. Глубокое пересечение:
// вершина одного кольца внутри другого глубже TOL, либо середина части ребра,
// лежащей внутри другого кольца, глубже TOL.
function ringsIntersect(ringsA,ringsB){
  const TOL=0.5;
  function deepIn(p,ring){ return inPoly2(p[0],p[1],ring) && polyEdgeDist(p[0],p[1],ring)>TOL; }
  function edgeDeep(ra,rb){ // части рёбер ra внутри rb
    for(let i=0;i<ra.length;i++){
      const p=ra[i], q=ra[(i+1)%ra.length];
      const dx=q[0]-p[0], dy=q[1]-p[1];
      const ts=[0,1];
      for(let j=0;j<rb.length;j++){
        const r=rb[j], s=rb[(j+1)%rb.length];
        const ex=s[0]-r[0], ey=s[1]-r[1];
        const det=dx*ey-dy*ex;
        if(Math.abs(det)<1e-12) continue;
        const t=((r[0]-p[0])*ey-(r[1]-p[1])*ex)/det;
        const w=((r[0]-p[0])*dy-(r[1]-p[1])*dx)/det;
        if(t>0&&t<1&&w>0&&w<1) ts.push(t);
      }
      ts.sort(function(a,b){ return a-b; });
      for(let k=0;k<ts.length-1;k++){
        const tm=(ts[k]+ts[k+1])/2;
        if(tm===ts[k]) continue;
        if(deepIn([p[0]+dx*tm,p[1]+dy*tm],rb)) return true;
      }
    }
    return false;
  }
  for(let a=0;a<ringsA.length;a++){
    for(let b=0;b<ringsB.length;b++){
      const ra=ringsA[a], rb=ringsB[b];
      if(!bboxOverlap(bboxOf(ra),bboxOf(rb))) continue; // быстрый отсев
      for(let i=0;i<ra.length;i++) if(deepIn(ra[i],rb)) return true;
      for(let i=0;i<rb.length;i++) if(deepIn(rb[i],ra)) return true;
      if(edgeDeep(ra,rb)||edgeDeep(rb,ra)) return true;
    }
  }
  return false;
}
// Валидация объекта: внутри участка (вершины + рёбра), пересечения, отступ, деревья под снос
function validateObj(name){
  const rings=objRings(name);
  const all=[];
  for(let i=0;i<rings.length;i++) for(let j=0;j<rings[i].length;j++) all.push(rings[i][j]);
  let inside=true;
  for(let i=0;i<all.length;i++)
    if(!inPoly2(all[i][0],all[i][1],V)){ inside=false; break; }
  if(inside){ // рёбра footprint не должны пересекать рёбра V (вогнутость участка)
    outer:
    for(let r=0;r<rings.length;r++){
      const ring=rings[r];
      for(let i=0;i<ring.length;i++){
        const a=ring[i], b=ring[(i+1)%ring.length];
        for(let j=0;j<V.length;j++){
          const c=V[j], d=V[(j+1)%V.length];
          if(segsCross(a[0],a[1],b[0],b[1],c[0],c[1],d[0],d[1])){ inside=false; break outer; }
        }
      }
    }
  }
  let minD=1e9;
  for(let i=0;i<all.length;i++) minD=Math.min(minD, polyEdgeDist(all[i][0],all[i][1],V));
  const clashes=[];
  const other=(name==='house')?'garage':'house';
  if(ringsIntersect(rings,objRings(other))) clashes.push((name==='house')?'гаражом':'домом');
  if(ringsIntersect(rings,[DRIVE])) clashes.push('подъездом');
  if(ringsIntersect(rings,[PK])) clashes.push('парковкой');
  let trees=0;
  for(let t=0;t<TREES.length;t++){
    for(let r=0;r<rings.length;r++){
      if(inPoly2(TREES[t][0],TREES[t][1],rings[r]) || polyEdgeDist(TREES[t][0],TREES[t][1],rings[r])<1.5){ trees++; break; }
    }
  }
  return {inside:inside, clashes:clashes, minD:minD, trees:trees};
}
const valState={house:null, garage:null};
function objOK(vs){ return vs && vs.inside && vs.clashes.length===0; }
function revalidate(){
  valState.house=validateObj('house');
  valState.garage=validateObj('garage');
  updateMoveUI();
}
// Луч от мыши через inverse view-projection до плоскости z=0
function unprojectGround(sx,sy){
  computePV();
  const cx=(sx-viewW/2)/PV.focal, cy=(viewH/2-sy)/PV.focal;
  const d=[PV.r[0]*cx+PV.up[0]*cy+PV.f[0],
           PV.r[1]*cx+PV.up[1]*cy+PV.f[1],
           PV.r[2]*cx+PV.up[2]*cy+PV.f[2]];
  if(d[2]>-1e-9) return null; // луч смотрит вверх/горизонтально
  const t=-PV.eye[2]/d[2];
  return [PV.eye[0]+d[0]*t, PV.eye[1]+d[1]*t];
}
// Попадание точки земли в footprint объекта (сначала гараж — он меньше)
function pickObject(gp){
  const cand=['garage','house'];
  for(let k=0;k<cand.length;k++){
    const rings=objRings(cand[k]);
    for(let r=0;r<rings.length;r++)
      if(inPoly2(gp[0],gp[1],rings[r])) return cand[k];
  }
  return null;
}

let canvas=null, ctx=null;

function drawPoly(p){
  const pr=p._pr, n=polyNormal(p.pts);
  // двустороннее освещение: нормаль разворачиваем к камере
  let cx=0,cy=0,cz=0;
  for(let i=0;i<p.pts.length;i++){ cx+=p.pts[i][0]; cy+=p.pts[i][1]; cz+=p.pts[i][2]; }
  cx/=p.pts.length; cy/=p.pts.length; cz/=p.pts.length;
  const vd=[PV.eye[0]-cx, PV.eye[1]-cy, PV.eye[2]-cz];
  let nn=n;
  if(n[0]*vd[0]+n[1]*vd[1]+n[2]*vd[2]<0) nn=[-n[0],-n[1],-n[2]];
  const k=0.55+0.45*Math.max(0, nn[0]*LIGHT[0]+nn[1]*LIGHT[1]+nn[2]*LIGHT[2]);
  const col=shade(p.color,k);
  ctx.beginPath();
  ctx.moveTo(pr[0][0],pr[0][1]);
  for(let i=1;i<pr.length;i++) ctx.lineTo(pr[i][0],pr[i][1]);
  ctx.closePath();
  ctx.fillStyle=col;
  ctx.fill();
  ctx.strokeStyle=col;   // тонкая обводка в цвет — скрывает швы
  ctx.lineWidth=0.6;
  ctx.stroke();
}
function projectPoly(p){
  const pr=[]; let dz=0;
  for(let i=0;i<p.pts.length;i++){
    const s=projectPoint(p.pts[i][0],p.pts[i][1],p.pts[i][2]);
    if(s[2]<0.8) return false; // вершина за камерой — пропускаем полигон
    pr.push(s); dz+=s[2];
  }
  p._pr=pr; p._dz=dz/p.pts.length;
  return true;
}
function drawLine(ln){
  const pr=[];
  for(let i=0;i<ln.pts.length;i++){
    const s=projectPoint(ln.pts[i][0],ln.pts[i][1],ln.pts[i][2]);
    if(s[2]<0.8) return;
    pr.push(s);
  }
  ctx.save();
  ctx.setLineDash(ln.dash||[]);
  ctx.strokeStyle=ln.color;
  ctx.lineWidth=1.2;
  ctx.beginPath();
  ctx.moveTo(pr[0][0],pr[0][1]);
  for(let i=1;i<pr.length;i++) ctx.lineTo(pr[i][0],pr[i][1]);
  ctx.stroke();
  ctx.restore();
}
function drawLabels(){
  ctx.font='10.5px system-ui,"Segoe UI",Arial,sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  // приоритет — сначала крупные комнаты; greedy deoverlap в экранных координатах:
  // подпись не рисуется, если её прямоугольник пересекает уже нарисованные
  const order=labels.slice().sort(function(a,b){ return (b.area||0)-(a.area||0); });
  const drawn=[];
  for(let i=0;i<order.length;i++){
    const lb=order[i];
    if(lb.room && roofOn) continue; // подписи комнат — только без крыши
    const s=projectPoint(lb.p[0],lb.p[1],lb.p[2]);
    if(s[2]<0.8) continue;
    let w=0;
    for(let j=0;j<lb.t.length;j++) w=Math.max(w,ctx.measureText(lb.t[j]).width);
    w+=8;
    const h=lb.t.length*12+5, x=s[0], y=s[1];
    const rc={x0:x-w/2-2, y0:y-h/2-2, x1:x+w/2+2, y1:y+h/2+2};
    let clash=false;
    for(let k=0;k<drawn.length;k++){
      const d=drawn[k];
      if(rc.x0<d.x1 && rc.x1>d.x0 && rc.y0<d.y1 && rc.y1>d.y0){ clash=true; break; }
    }
    if(clash) continue;
    drawn.push(rc);
    ctx.fillStyle='rgba(245,242,234,0.78)'; // полупрозрачная светлая подложка
    ctx.fillRect(x-w/2,y-h/2,w,h);
    ctx.fillStyle='#4A453A';
    for(let j=0;j<lb.t.length;j++)
      ctx.fillText(lb.t[j], x, y+(j-(lb.t.length-1)/2)*12);
  }
}
function drawOverlays(){
  const c=cam.target;
  // масштабная линейка 10 м (в плоскости target, вдоль экранной горизонтали)
  const a=projectPoint(c[0]-PV.r[0]*5, c[1]-PV.r[1]*5, c[2]-PV.r[2]*5);
  const b=projectPoint(c[0]+PV.r[0]*5, c[1]+PV.r[1]*5, c[2]+PV.r[2]*5);
  if(a[2]>0.8 && b[2]>0.8){
    const len=Math.hypot(b[0]-a[0],b[1]-a[1]);
    const x=40, y=viewH-36;
    ctx.strokeStyle='#6A6558'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(x,y); ctx.lineTo(x+len,y);
    ctx.moveTo(x,y-5); ctx.lineTo(x,y+5);
    ctx.moveTo(x+len,y-5); ctx.lineTo(x+len,y+5);
    ctx.stroke();
    ctx.fillStyle='#6A6558';
    ctx.font='11px system-ui,Arial,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText('10 м', x+len/2, y-6);
  }
  // стрелка севера (север = +Y)
  const p0=projectPoint(c[0],c[1],c[2]);
  const p1=projectPoint(c[0],c[1]+10,c[2]);
  if(p0[2]>0.8 && p1[2]>0.8){
    let dx=p1[0]-p0[0], dy=p1[1]-p0[1];
    const L=Math.hypot(dx,dy)||1e-9; dx/=L; dy/=L;
    const ax=viewW-56, ay=104, R=26;
    ctx.beginPath(); ctx.arc(ax,ay,R,0,Math.PI*2);
    ctx.fillStyle='rgba(245,242,234,0.85)'; ctx.fill();
    ctx.strokeStyle='#8A8578'; ctx.lineWidth=1.2; ctx.stroke();
    const tx=ax+dx*(R-7), ty=ay+dy*(R-7);
    const bx=ax-dx*(R-9), by=ay-dy*(R-9);
    ctx.strokeStyle='#7A6A55'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(tx,ty); ctx.stroke();
    // наконечник
    const px=-dy, py=dx;
    ctx.beginPath();
    ctx.moveTo(ax+dx*(R-2), ay+dy*(R-2));
    ctx.lineTo(tx+px*4, ty+py*4);
    ctx.lineTo(tx-px*4, ty-py*4);
    ctx.closePath();
    ctx.fillStyle='#7A6A55'; ctx.fill();
    ctx.fillStyle='#4A453A';
    ctx.font='bold 12px system-ui,Arial,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('С', ax+dx*(R+9), ay+dy*(R+9));
  }
}
function render(){
  computePV();
  // небо/фон сцены: вертикальный градиент
  const g=ctx.createLinearGradient(0,0,0,viewH);
  g.addColorStop(0,'#E8EDE8'); g.addColorStop(1,'#F5F2EA');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,viewW,viewH);
  // 1) плоские «земляные» полигоны — по высоте z
  const L0=polys.filter(function(p){ return p.layer===0; });
  L0.sort(function(a,b){ return a.zv-b.zv; });
  for(let i=0;i<L0.length;i++)
    if(projectPoly(L0[i])) drawPoly(L0[i]);
  // 2) плоские пунктирные линии (разметка) — до объёмных объектов
  for(let i=0;i<lines.length;i++) drawLine(lines[i]);
  // 3) объёмные полигоны — painter's algorithm по средней глубине
  const L1=polys.filter(function(p){
    return p.layer===1 && (!p.roof || roofOn) && (!p.interior || !roofOn);
  });
  const vis=[];
  for(let i=0;i<L1.length;i++)
    if(projectPoly(L1[i])) vis.push(L1[i]);
  vis.sort(function(a,b){ return b._dz-a._dz; }); // от дальних к ближним
  for(let i=0;i<vis.length;i++) drawPoly(vis[i]);
  // 3b) подсветка выбранного объекта: контур плиты/фундамента + лёгкое залитие
  if(moveMode && sel){
    const rings=objRings(sel);
    const ok=objOK(valState[sel]);
    const col=ok?'#C9A227':'#B03030';
    for(let r=0;r<rings.length;r++){
      const ring=rings[r], pr=[];
      let okp=true;
      for(let i=0;i<ring.length;i++){
        const s=projectPoint(ring[i][0],ring[i][1],0.06);
        if(s[2]<0.8){ okp=false; break; }
        pr.push(s);
      }
      if(!okp) continue;
      ctx.beginPath();
      ctx.moveTo(pr[0][0],pr[0][1]);
      for(let i=1;i<pr.length;i++) ctx.lineTo(pr[i][0],pr[i][1]);
      ctx.closePath();
      ctx.fillStyle=ok?'rgba(201,162,39,0.18)':'rgba(176,48,48,0.20)';
      ctx.fill();
      ctx.strokeStyle=col;
      ctx.lineWidth=3;
      ctx.stroke();
    }
  }
  // 4) подписи и оверлеи
  if(labelsOn) drawLabels();
  drawOverlays();
}

/* ================================================================
   УПРАВЛЕНИЕ И ИНИЦИАЛИЗАЦИЯ
   ================================================================ */
function resize(){
  if(!canvas) return;
  const dpr=window.devicePixelRatio||1;
  viewW=canvas.clientWidth||window.innerWidth;
  viewH=canvas.clientHeight||window.innerHeight;
  canvas.width=Math.round(viewW*dpr);
  canvas.height=Math.round(viewH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!window.__userMovedCam) fitDist(); // подогнать кадр под новый размер, если камеру не трогали
  dirty=true;
}
function init(){
  canvas=document.getElementById('scene');
  ctx=canvas.getContext('2d');
  resize();
  resetCam(); // стартовая камера: участок ~78% ширины кадра
  window.addEventListener('resize',resize);

  let dragging=false, panMode=false, lx=0, ly=0;
  function evtXY(e){ const r=canvas.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
  canvas.addEventListener('mousedown',function(e){
    window.__userMovedCam=true;
    if(moveMode && e.button===0){
      const xy=evtXY(e);
      const gp=unprojectGround(xy[0],xy[1]);
      const hit=gp?pickObject(gp):null;
      if(hit){ // выбрать объект и захватить (grab-offset, центр не прыгает под курсор)
        sel=hit;
        grab={obj:hit, off:[state[hit].c[0]-gp[0], state[hit].c[1]-gp[1]]};
        updateMoveUI(); dirty=true;
        e.preventDefault();
        return; // орбита на этом drag не срабатывает
      }
      if(sel){ sel=null; updateMoveUI(); dirty=true; } // клик мимо — снять выбор, дальше обычная орбита
    }
    dragging=true;
    panMode=(e.button===2 || e.shiftKey);
    lx=e.clientX; ly=e.clientY;
    e.preventDefault();
  });
  window.addEventListener('mousemove',function(e){
    if(grab){ // drag выбранного объекта по земле
      const xy=evtXY(e);
      const gp=unprojectGround(xy[0],xy[1]);
      if(gp){
        state[grab.obj].c=[gp[0]+grab.off[0], gp[1]+grab.off[1]];
        rebuildObj(grab.obj);
      }
      return;
    }
    if(!dragging) return;
    const dx=e.clientX-lx, dy=e.clientY-ly;
    lx=e.clientX; ly=e.clientY;
    if(panMode){
      computePV();
      const wpp=cam.dist/PV.focal; // мировых метров на пиксель у target
      cam.target[0]-=(PV.r[0]*dx - PV.up[0]*dy)*wpp;
      cam.target[1]-=(PV.r[1]*dx - PV.up[1]*dy)*wpp;
      cam.target[2]-=(PV.r[2]*dx - PV.up[2]*dy)*wpp;
      if(cam.target[2]<0) cam.target[2]=0;
    } else {
      cam.az-=dx*0.005;
      cam.el=Math.min(1.55,Math.max(0.05,cam.el+dy*0.005));
    }
    dirty=true;
  });
  window.addEventListener('mouseup',function(){ dragging=false; grab=null; });
  canvas.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  canvas.addEventListener('wheel',function(e){
    window.__userMovedCam=true;
    cam.dist*=(e.deltaY>0)?1.1:0.9;
    cam.dist=Math.min(260,Math.max(15,cam.dist));
    dirty=true;
    e.preventDefault();
  },{passive:false});

  const btnRoof=document.getElementById('btnRoof');
  const btnTop=document.getElementById('btnTop');
  const btnLabels=document.getElementById('btnLabels');
  const btnReset=document.getElementById('btnReset');
  btnRoof.addEventListener('click',function(){
    roofOn=!roofOn;
    btnRoof.textContent='Крыша: '+(roofOn?'вкл':'выкл');
    btnRoof.classList.toggle('off',!roofOn);
    dirty=true;
  });
  btnTop.addEventListener('click',function(){
    cam.el=1.53;                 // почти строго сверху
    fitDist();
    dirty=true;
  });
  btnLabels.addEventListener('click',function(){
    labelsOn=!labelsOn;
    btnLabels.textContent='Подписи: '+(labelsOn?'вкл':'выкл');
    btnLabels.classList.toggle('off',!labelsOn);
    dirty=true;
  });
  btnReset.addEventListener('click',resetCam);

  /* ---- Режим перемещения: кнопки и панели ---- */
  btnMove=document.getElementById('btnMove');
  rotPanel=document.getElementById('rotPanel');
  rotVal=document.getElementById('rotVal');
  rotObj=document.getElementById('rotObj');
  infoPanel=document.getElementById('infoPanel');
  warnDiv=document.getElementById('warn');
  btnMove.addEventListener('click',function(){
    moveMode=!moveMode;
    if(!moveMode){ sel=null; grab=null; }
    updateMoveUI(); dirty=true;
  });
  const rotBtns=rotPanel.querySelectorAll('button[data-d]');
  for(let i=0;i<rotBtns.length;i++){
    rotBtns[i].addEventListener('click',function(){
      if(!sel) return;
      state[sel].ang+=parseFloat(this.getAttribute('data-d'));
      rebuildObj(sel); // поворот вокруг центра объекта
    });
  }
  document.getElementById('btnResetPos').addEventListener('click',function(){
    if(!sel) return;
    state[sel].c=(sel==='house'?C_h:C_g).slice();
    state[sel].ang=0;
    rebuildObj(sel);
  });
  revalidate(); // начальная валидация
  // Тестовый hook через query: ?move=1&sel=house&x=..&y=..&ang=..&top=1
  (function(){
    const q=new URLSearchParams(location.search);
    if(q.get('top')==='1'){ cam.el=1.53; fitDist(); }
    if(q.get('move')==='1') moveMode=true;
    const sq=q.get('sel');
    if(moveMode && (sq==='house'||sq==='garage')){
      sel=sq;
      if(q.get('x')!==null) state[sel].c[0]=parseFloat(q.get('x'));
      if(q.get('y')!==null) state[sel].c[1]=parseFloat(q.get('y'));
      if(q.get('ang')!==null) state[sel].ang=parseFloat(q.get('ang'));
      rebuildObj(sel);
    }
    updateMoveUI(); dirty=true;
  })();

  requestAnimationFrame(frame);
}
function frame(){
  if(dirty){ dirty=false; render(); }
  requestAnimationFrame(frame);
}
if(typeof document!=='undefined' && typeof window!=='undefined' && document.getElementById){
  init();
}
</script>
</body>
</html>
